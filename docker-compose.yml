services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haorwatch
    ports:
      - "5432:5432"
    volumes:
      - haorwatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haorwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  haorwatch_pgdata:
